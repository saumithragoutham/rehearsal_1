2019t sound even vaguely sure about that", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "oh! but you kept it anonymous", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "very astute", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "ha-ha. i just didn\u2019t realize anonymity was even an option anymore. i thought we did away with it", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "i preferred it for this MNG ( reading ): \u2026 makes sense. ASST reenters, holding a can of soda and a bag of chips.", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "here, ask him yourself", "stage_direction": null}, {"character": "ARTS & CULTURE EDITOR (A&C)", "text": "uh-oh", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "oh no no", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "oh come on", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "no food in the editing room", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "oh i thought that was just like \u2013", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "absolutely no food", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "\u2013 for meals or something", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "no you cannot have any food", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "calm down, it\u2019s a bag of chips", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "that\u2019s still food. there\u2019ll be crumbs all over and we just got rid of the mice from last semester", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "i just figured i could be here to PORTS EDITOR (SPORTS)", "text": "i don\u2019t know what you\u2019re talking about", "stage_direction": null}, {"character": "ARTS & CULTURE EDITOR (A&C)", "text": "oh, i just \u2013 i texted you. like, later on \u2013", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "i didn\u2019t see you at the party.", "stage_direction": null}, {"character": "ARTS & CULTURE EDITOR (A&C)", "text": "what? yes you \u2013 yeah, you did, we\u2026 saw each other", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "i don\u2019t remember that. must\u2019ve had a lot to drink.", "stage_direction": null}, {"character": "ARTS & CULTURE EDITOR (A&C)", "text": "right. The other editors enter then in a rush of noise. MNG is wearing an unseasonable winter coat.", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "closed down the dining hall", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "they gave us all this free stuff", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "since they were getting rid of it", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "but we didn\u2019t want to risk bringing it in", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "after last week ASST is visibly embarrassed. Everyone settles into their seats. EIC looks around. She doesn\u2019t like this configuration.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "okay, everyone shuffle. The editors pick up their belongings and shift seats with the typical grumbles. A&C and SPORTS had been sitting next to each other. A&C moves to sit next to SPORTS again amidst the shuffle. SPORTS puts his bag in the seat, blocking A&C from doing so.", "stage_direction": null}, {"character": "ARTS & CULTURE EDITOR (A&C)", "text": "oh. um. He hesitates, then awkwardly sits next to NEWS. MNG loudly rustles in her coat. When it draws no attention, she does it again and clears her throat.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "do you need something?", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "still have the cold sweats from this weekend? EIC and MNG ( in unison ): that\u2019s not funny MNG is surprised by EIC\u2019s defense.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "\u2026 and no. i don\u2019t need anything A pause. Typing sounds.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "but isn\u2019t anyone going to ask about my coat? i\u2019ve been wearing it all night", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "oh god No one bites. Until\u2026", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "um\u2026 so why are you wearing a coat?", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "no, please, you\u2019re giving her what she wants \u2013", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "i am so glad that you asked! MNG stands and dramatically removes her coat to reveal a NASTY WOMAN shirt. She shows it off accordingly.", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "where did you get that", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "oh my god sit down", "stage_direction": null}, {"character": "ARTS & CULTURE EDITOR (A&C)", "text": "iconic", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "no i\u2019m serious i need one", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "that\u2019s ridiculous", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "this is the whitest you\u2019ve ever been", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "don\u2019t hate me \u2018cause you ain\u2019t me", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "thank god i\u2019m not", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "are we done? can you keep writing now?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "just one more thing\u2026 MNG digs through her bag and withdraws a stack of papers.", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "oh god. what is that? MNG begins to hand them out to the editors.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "mockup ballots! to make it easy to know who to vote for on november these are all candidates who are backed by the democratic party, so\u2026 She hands a ballot to SPORTS.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "in case you have a change of heart. MNG hands a ballot to OP-ED, who pointedly crumples it and tosses it over her own shoulder.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "hey. no littering in the office. pick it up. OP-ED does as she\u2019s told.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "oh my god, if you didn\u2019t want one, you could\u2019ve just said so, not wasted my printing dollars.", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "i don\u2019t need your cheat sheet if i\u2019m not voting for your party", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "welcome to the dark side", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "i\u2019m not voting for your dude either. i\u2026 am voting for harambe.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "the gorilla ? NEWS and A&C ( in sync ): rest in peace king NEWS and A&C perform some sort of ritual for their fallen hero.", "stage_direction": null}, {"characte NAGING EDITOR (MNG)", "text": "oh.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "okay, that\u2019s enough. no more interrogating the child. no more of this, either. EIC picks up the mockup ballot and waves it around.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "i know these are unprecedented times, or so they say, but remember what dr. birch told us in september: we are a nonpartisan organization. our paper does not back any party. that\u2019s how we stay reputable. so if we\u2019re not publishing political pieces, except in op-ed \u2013", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "oh my god just say you think op-ed is trash EIC does not acknowledge that.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "\u2013 we also cannot be pushing political agendas in our own staff room. our job is to report. that\u2019s that. got it?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "\u2026fine. MNG takes back the remaining mockup ballot, dusts her shirt off, and sits down with all of her dignity still very much intact.", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "you\u2019re much less green than when i last saw you", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "oh please", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "i\u2019m just saying", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "yes we\u2019re all aware", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "um aware of what OP-ED ( to MNG ): i\u2019m just saying, you were in much rougher shape then\u2026 and wearing a lot less clothing", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "well obviously i\u2019m fine, so", "stage_direction": null}, {"character": }, {"character": "NEWS EDITOR (NEWS)", "text": "no let them go", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "yeah maybe it\u2019s time to own it you were trashed from the moment you showed up", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "but we have an actual paper to write", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "shhhh", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "i was not it\u2019s not my fault that you slipped something into your punch", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "i didn\u2019t drug the drinks at my own party. are you stupid?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "oh so now i\u2019m a stupid alcoholic", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "if the shoe fits", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "i\u2019m going to call her again.", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "wait. you have her number? i don\u2019t even have her number", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "you know what? i don\u2019t have to take this i\u2019m in charge this week ASST pulls out his phone and dials. ASST ( to NEWS, whispering ): right to voicemail OP-ED ( indicating EIC\u2019s chair ): where is she?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "not here. so i\u2019m hbic. and hbic says you can\u2019t censor writers", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "censorship. i\u2019m defending myself and you\u2019re calling it censorship? ASST ( to EIC\u2019s voicemail ): hi, um it\u2019s\u2026 um\u2026 we\u2019re in the news room\u2026 hope you\u2019re okay and everything\u2026 MNG ( mockingly ): if the shoe fits\u2026", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "this is bullshit.", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "i think we could really use you in the news room right now so ummm\u2026if you could\u2026 maybe\u2026 i mean if it\u2019s convenient\u2026 stop by\u2026", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "i\u2019m sorry you think that", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "if you\u2019re in charge, how about you edit my section then? i\u2019m not doing this anymore NEWS ( to OP-ED) : wait are you like quitting quitting? OP-ED (to MNG): my stuff\u2019s in your inbox. and i\u2019m sure you have your article already. Bye.", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "maybe\u2026 please\u2026 um\u2026 yes. goodbye. OP-ED exits. Only three editors remain. \u2026 \u2026", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "what the hell\u2026", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "what do we do now?", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "i mean\u2026 we can edit news still", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "no. i need your help. we have to publish", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "that\u2019s kind of crazy", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "do we have all of the articles?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "everything but the spotlight piece. my article is fine, you can skim it but i don\u2019t think it\u2019ll need many edits, especially since it\u2019s op-ed", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "wait, so you did write that?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "obviously", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "whoa\u2026", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "isn\u2019t that kind of harsh?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "so was calling me an alcoholic NEWS : i mean she only did that after you called her a predator", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "i didn\u2019t call her a predator", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "you sort of did", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "oh my god. okay can we just shuffle? i need to move MNG stands. NEWS does not move.", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "no i don\u2019t think so i think my perspective\u2019s just fine, actually, thanks MNG : i said shuffle", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "and i said no A beat. Tension.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "either get up or get out.", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "are you serious? ASST ( to NEWS ): can\u2019t you just move?", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "absolutely not.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "well then you\u2019ve made your choice.", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "are you asking me to leave?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "i\u2019m telling both of you to leave.", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "you\u2019re going to edit the entire paper by yourself?", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "that\u2019s insane", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "we can help", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "don\u2019t act like you\u2019re some sort of martyr MANAGING ( pointed ): i said you can go ASST looks to NEWS. NEWS hesitates. Finally she stands.", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "fine. this is ridiculous, i hope you know that. you\u2019re going to be here all night and it\u2019s your own fault, because you get all nasty as soon as someone dares to criticize you even a little bit. and you know what? maybe i was wrong. maybe dr. birch was right. it\u2019s good that you\u2019re not editor-in-chief. because clearly you can\u2019t handle it \u2013 MNG ( interrupting, at a yell ): can you just get the fuck out?! NEWS and ASST leave. MNG is alone. Eventually she picks up her phone and puts it to her ear again. It goes straight to voicemail. MNG ( getting progressively more emotional) : hey. it\u2019s me. this is probably like the twenty-fifth voicemail i\u2019m leaving you so i\u2019m sure you\u2019re not listening to these anymore if you ever were but in case you are: if you could just like come down here it\u2019s just me left and i \u2026 i have no idea what i\u2019m doing, okay? this isn\u2019t my job but i can\u2019t be the reason this paper isn\u2019t published because well obviously so like please just yeah this is crazy i hope you\u2019re, like, okay but um please help. Eventually she hangs up. She stares at her computer.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "fuck! Blackout. electoral / college There is no one onstage. In the darkness, a projection appears: NPR, November 9, \u2013 \u201cDonald Trump Wins The Presidency In Major Upset\u201d by Carrie Johnson. The projection fades. The dream light creeps in. EIC enters the newsroom normally. She\u2019s wearing the same clothes as before. Eventually: the sound of a phone vibrating. EIC searches for it. She finds her own phone as well as some wipes. When she unlocks the phone, suddenly, a sound fills the space. A recording. EIC ( on recording ): okay, i think it\u2019s on. it\u2019s november 1, i\u2019m here with dr. jonathan birch \u2013 EIC stops the recording. She realizes what she has. She puts headphones in. She listens. EIC begins to clean the phone with the wipes. The dream lights slowly fade, giving way to normal light. EIC is still listening when MNG enters. MNG is wearing all black. EIC freezes when she realizes someone else is there.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "\u2026 is this a fucking joke? you haven\u2019t been in class i went to your apartment and you didn\u2019t answer i\u2019ve called you so many times so has everyone else and you just show up here ? today ? with no explanation? we thought you were like dead what the fuck happened? As MNG speaks, EIC begins to clean her own skin with the wipes.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "hello? i think you at least owe me an explanation. \u2026", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "okay well i edited this paper alone last week i was here for twelve hours so thank you so much for helping out and doing your job MNG awaits a response from EIC. There isn\u2019t one.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "maybe it\u2019s time to file for a formal role switch because if you can\u2019t even show up i don\u2019t think you can be editor-in-chief", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "where is everyone else? you need a majority vote to make yourself editor-in-chief when there already is one", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "or maybe i just need to go to our club advisor and tell him our supposed leader isn\u2019t showing face", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "you\u2019re not going to do that", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "no? why not?", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "because you need me. i read last week\u2019s paper. it was a complete mess", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "i don\u2019t think you can critique what you didn\u2019t contribute to", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "was that your work? your editing? there was a typo on the homepage MNG : well normally we have more eyes on it!", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "we\u2019re not switching roles if you can\u2019t even edit!", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "fine!", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "fine! EIC\u2019s cleaning of herself has begun to border on violence. MNG takes the wipe away. She takes a long look at EIC.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "\u2026 are you okay?", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "don\u2019t try and steal my job then pretend to be my friend.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "oh my god. forget it. MNG sits. She opens her computer. She starts scrolling. EIC sits. She opens her computer. She starts scrolling. EIC frowns. She backspaces for a bit. Types. Frowns harder. This goes on for a little bit before:", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "did you change the EIC email password?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "you weren\u2019t here!", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "i cannot believe you \u2013", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "it\u2019s both of our birthdays, okay?! jesus. it\u2019s my birthday then your birthday. no capitals. EIC tries that. It works.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "\u2026 thank you. They look at their laptops in silence.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "the inboxes are empty", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "yeah", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "\u2026 what happened last week?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "i tried to tell you", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "what did you do when i was gone?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "well the paper got published, okay? that\u2019s what matters: the publishing streak isn\u2019t broken", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "but what about this week?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "i don\u2019t know", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "i don\u2019t either. \u2026", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "the election\u2026", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "i know.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "what do we do?", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "i really, truly, do not know. The two young women sit in an uncertain silence. ASST enters. He sees EIC.", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "whoa. what? i thought you were like\u2026 i mean are you\u2026 are you allowed to be here? you were just\u2026 gone last week. are you still EIC?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "yes. she is. ASST ( not agreeing with that choice ): um\u2026 okay. ASST turns to MNG.", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "you didn\u2019t\u2026 um\u2026. you said you would\u2026 ASST takes a deep breath.", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "you said you\u2019d publish my article last week my debate article you said it was really good and that you\u2019d publish it and now it\u2019s nowhere to be found on the website", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "oh. i must\u2019ve forgotten.", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "\u2026 well that\u2019s not\u2026 you can\u2019t just\u2026 it should be up there", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "i can\u2019t publish it now", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "well yeah. the election\u2019s over. she lost. A beat. Tension.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "\u2026 if you could vote, who would you have voted for?", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "um\u2026 i don\u2019t think you\u2019re supposed to ask me that", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "it\u2019s a hypothetical. who would you have voted for?", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "i\u2019m\u2026 i\u2019m not answering that.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "right.", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "so can we edit now? OP-ED enters. She\u2019s a mess.", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "\u2026 hi.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "\u2026 hi.", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "i thought you quit.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "what?", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "i did.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "you quit?", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "or at least \u2026i think i did. i just\u2026 couldn\u2019t be alone right now?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "\u2026 yeah. i get that.", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "you didn\u2019t publish that article about me. when i checked the website i didn\u2019t see it anywhere. did you publish it?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "\u2026 no. i didn\u2019t. \u2026 i\u2019m sorry.", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "okay. um. \u2026 me too. for saying what i said. not for hosting a party.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "yeah, okay, that\u2019s fair. SPORTS enters. He is wearing a red hat. \u2018MAKE AMERICA GREAT AGAIN\u2019. A tense silence.", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "man\u2026 what the fuck.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "can you take that fucking thing off?", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "no i don\u2019t think i will i\u2019m not going to be embarrassed. he won i told you more than twelve people would vote for him", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "okay well you don\u2019t have to walk around flaunting it", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "i\u2019m not flaunting this is just how it is now it\u2019s only going to hurt you more if you sit here in denial she conceded it\u2019s over he won it\u2019s going to be a good thing", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "for who? for you and your fellow straight white men? who else?", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "he said he\u2019s going to be a president for everybody we have to give him that chance", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "it\u2019s not a day free trial he\u2019s going to be commander-in-chief of this country", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "well we have to trust that he means well", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "i don\u2019t i don\u2019t trust that at all SPORTS finally notices EIC.", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "i can\u2019t believe you\u2019re even here! where were you last week? it was a mess. you\u2019re absent, she let everything fall apart He is indicating MNG.", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "you know what? maybe neither of you are fit to lead this paper.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "that\u2019s bullshit", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "maybe i need to go talk to dr. birch and \u2013 EIC ( with sudden force ): no. you\u2019re not doing that. Before anything else can happen, A&C and NEWS enter. NEWS is carrying a stack of papers. NEWS ( frantic ): i have articles! more than we need! so many words and i emailed them and printed them and \u2013 NEWS sees SPORTS.", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "he needs to go.", "stage_dire  single thursday we publish even last week i was alone and i still got it done we still have to get it done", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "didn\u2019t you say our job is reporting?", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "actually i think it\u2019s time to contact dr. birch spent five hours on wikipedia", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "looking up how polling stations work, it\u2019s a lot more than a lever, people need to know that", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "i thought this was a serious organization EIC ( steadily breaking down ): enough! i said we\u2019re not publishing, so we\u2019re not publishing. that\u2019s it. this isn\u2019t a debate. it\u2019s my decision and what i say is final. this is\u2026 this still my paper. it\u2019s mine it\u2019s still mine. it\u2019s still\u2026 i\u2019m still\u2026 i\u2019m\u2026 i\u2026 EIC cries. Silence. None of them have ever seen this before. MNG crosses to EIC. MNG ( softly ): what do you need?", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "\u2026 i need to write.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "\u2026 okay whatever you need to write write it EIC crosses to her computer. Sits. Opens it. A projection appears. It\u2019s a blank Word document. The cursor blinks. A moment of trepidation. EIC begins to type. The words appear on the screen as she does. As she types, the editors begin to lean over to see her screen. She writes: \u2018This article was supposed to be the summary of an interview that took place with Dr. Jonathan Birch during the evening of November 1, I initially proposed that this interview should take place in his office. He instead invited me to his house. Upon my arrival, I realized that we were the only two present. I did not question this at the time. He offered me bourbon. We drank. We talked. Eventually I asked him about his favorite things about his job at the college. This was when Dr. Birch proceeded to\u2019 EIC freezes After a moment she smacks her laptop closed. The projection disappears. She shakes her head.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "oh my god", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "i can\u2019t do this", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "did he\u2026?", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "i can\u2019t i can\u2019t i can\u2019t", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "did he?", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "he did.", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "shit\u2026", "stage_direction": null}, {"character": "ARTS & CULTURE EDITOR (A&C)", "text": "i\u2019m so sorry\u2026", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "i can\u2019t write about this", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "have you told anyone?", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "no", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "then maybe you have to", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "no no no i can\u2019t you don\u2019t understand i mean i \u2013 i have the recording of the interview", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "oh my god", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "i\u2019ve listened to it over and over and over but i don\u2019t\u2026 i\u2026 at one point he must have reached out and stopped it. i didn\u2019t even realize. so i don\u2019t have the um\u2026 the whole thing. A beat. What is there to say?", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "god. i was so stupid. once he invited me to his house i got all done up, put on perfume, put lipstick on \u2013", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "you got done up ? what were you wearing?", "stage_direction": null}, {"character": "OP-ED EDITOR (OP-ED)", "text": "whoa.", "stage_direction": null}, {"character": "NEWS EDITOR (NEWS)", "text": "you can\u2019t ask her that!", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "are you saying it was my fault for wearing makeup?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "of course i\u2019m not! but you and i both know this is the shit they\u2019re going to ask. so: what were you wearing?", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "normal clothes. nothing\u2026 crazy.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "okay. and what about alcohol? you said in the article you had bourbon, right? how much?", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "i don\u2019t know. i had one glass and was going to leave it at that but then he said i might as well polish off the bottle and i didn\u2019t want to be rude \u2013", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "okay.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "it wasn\u2019t like i blacked out. i remember plenty. and i have the audio. but i still don\u2019t\u2026 i don\u2019t know if it\u2019s enough. especially now. today. i don\u2019t know if anyone will take it seriously. and if i put this out into the world and no one takes it seriously\u2026 MNG understands the unspoken: if no one believes EIC, it will crush her.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "okay. okay\u2026 well\u2026 what if\u2026 what if i listen to it? and then i can tell you. EIC hesitates.", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "you don\u2019t have to do anything you don\u2019t want to. How ironic. EIC knows it is. But still:", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "okay. Hesitantly, EIC pulls out her phone and headphones. She offers one to MNG. MNG hesitates.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "i\u2019m\u2026 really sorry.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "it\u2019s not your fault.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "isn\u2019t it though? i asked you to write the article. i thought you\u2019d be safe with him. i had no idea it\u2019d lead to\u2026", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "i know.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "\u2026okay. EIC and MNG both put in one earphone. EIC scrolls on her phone.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "that\u2019s it. She hits play. Maybe we can hear faint audio, muffled voices, but we cannot make out what they say. EIC and MNG can. Tense stillness. They listen. At some point MNG gasps. A few more seconds\u2026", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "that\u2019s all i\u2019ve got. i just don\u2019t know\u2026", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "yeah i mean well like, i think it\u2019ll be\u2026 i mean i think you can hear\u2026", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "you\u2019re not sure?", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "it\u2019s enough for me i just don\u2019t know if it\u2019ll be enough for all of them EIC takes the headphones and holds them out to SPORTS.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "listen to it.", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "you want me to \u2013", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "please. i\u2026 i need to know. After a moment of pause, SPORTS take the headphones. EIC rewinds. SPORTS listens. Eventually he grimaces.", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "jesus\u2026 SPORTS rakes a hand through his hair, knocking the red hat off of his head. It lands wherever it lands. He can only tolerate a little bit longer then reaches forward to pause it. He looks surely at EIC.", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "yes. yes, you can tell.", "stage_direction": null}, {"character": "CAST OF CHARACTERS EDITOR-IN-CHIEF (EIC)", "text": "i just\u2026 i don\u2019t think i said no, or anything like that", "stage_direction": null}, {"character": "SPORTS EDITOR (SPORTS)", "text": "it doesn\u2019t matter. it\u2019s clear as day: you\u2019re not into what he\u2019s doing.", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "um, except\u2026", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "except what ?", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "i mean maybe i\u2019m just confused? i might just be confused.", "stage_direction": null}, {"character": "MANAGING EDITOR (MNG)", "text": "what about rape is confusing to you?", "stage_direction": null}, {"character": "ASSISTANT NEWS EDITOR (ASST)", "text": "no no no it\u2019s just um it\u2019s just like     const player = new Audio();

    const container = document.getElementById('scriptDisplay');
    DATA.lines.forEach((line, idx) => {
      const isUser = line.character === DATA.userCharacter;
      const card = document.createElement('div');
      card.id = 'line-' + idx;
      card.className = 'line-card ' + (isUser ? 'user' : '');
      card.onclick = () => jumpTo(idx);
      card.innerHTML = `
        <div><span class="speaker-badge" style="background: ${isUser ? '#10b981' : '#3b82f6'}">${line.character} ${isUser ? '(YOU)' : ''}</span></div>
        <div class="text">${line.text}</div>
        ${line.stage_direction ? `<div class="direction">(${line.stage_direction})</div>` : ''}
      `;
      container.appendChild(card);
    });

    function updatePauseUI() {
      const btn = document.getElementById('pauseBtn');
      btn.innerText = isPaused ? '▶ Play' : '⏸ Pause';
      btn.style.background = isPaused ? '#10b981' : '#f59e0b';
    }

    function jumpTo(idx) {
      player.pause();
      currentIndex = idx;
      isPaused = false;
      updatePauseUI();
      playCurrent();
    }

    function togglePause() {
      if (isPaused) {
        isPaused = false;
        updatePauseUI();
        if (player.src && player.paused && player.currentTime > 0) {
          player.play();
        } else {
          playCurrent();
        }
      } else {
        isPaused = true;
        updatePauseUI();
        player.pause();
      }
    }

    function advanceLine() {
      player.pause();
      isPaused = false;
      updatePauseUI();
      currentIndex++;
      playCurrent();
    }

    function playCurrent() {
      if (currentIndex >= DATA.lines.length || isPaused) return;

      document.querySelectorAll('.line-card').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById('line-' + currentIndex);
      if (activeEl) {
        activeEl.classList.add('active');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      const line = DATA.lines[currentIndex];
      if (line.character === DATA.userCharacter) return;

      const audioSrc = DATA.audio[currentIndex];
      if (!audioSrc) {
        currentIndex++;
        playCurrent();
        return;
      }

      player.src = audioSrc;
      player.onloadedmetadata = () => {
        if (player.duration > 0.6 && DATA.trim > 0) {
          player.currentTime = DATA.trim;
        }
      };
      player.onended = () => {
        if (!isPaused) {
          currentIndex++;
          playCurrent();
        }
      };
      player.play().catch(e => console.warn(e));
    }
  <\/script>
</body>
</html>
